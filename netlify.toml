# Theli marketing site — static, no build step.
[build]
  publish = "."

# Canonicalize www → apex (apex theli.app is the public URL).
[[redirects]]
  from = "https://www.theli.app/*"
  to = "https://theli.app/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Static marketing site: self + Google Fonts only, no third-party scripts/trackers.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# styles.css and app.js keep stable filenames (no build-step content hashing),
# so they must revalidate — otherwise edits never reach returning visitors.
# max-age=0 + must-revalidate => browser revalidates via ETag each load; Netlify
# returns a cheap 304 when unchanged, and the fresh file when it changes.
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
